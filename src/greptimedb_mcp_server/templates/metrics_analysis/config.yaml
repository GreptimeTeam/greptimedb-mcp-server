description: "SQL and RANGE analysis for existing GreptimeDB time-series tables."
version: "1.0"
arguments:
  - name: "topic"
    description: "Topic or area of metrics to analyze"
    required: false
  - name: "start_time"
    description: "Start time for the analysis period, example:(2025-01-01T00:00:00Z, now)"
    required: true
  - name: "end_time"
    description: "End time for the analysis period, example:(2025-01-01T01:00:00Z, now())"
    required: true
metadata:
  tags:
    - monitoring
    - metrics
    - performance
  suggested_use: "Analyze existing time-series tables with SQL and RANGE queries."
  output_format: "markdown"
 
